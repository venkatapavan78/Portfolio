<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="taskBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0e1f"/>
      <stop offset="100%" stop-color="#191533"/>
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="340" fill="url(#taskBgGrad)"/>

  <!-- Browser Header Window -->
  <rect width="600" height="36" fill="#090817"/>
  <circle cx="20" cy="18" r="5" fill="#ef4444"/>
  <circle cx="36" cy="18" r="5" fill="#f59e0b"/>
  <circle cx="52" cy="18" r="5" fill="#10b981"/>
  
  <!-- Address Bar -->
  <rect x="75" y="8" width="450" height="20" rx="10" fill="#1e1b38"/>
  <text x="240" y="22" fill="#c4b5fd" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" text-anchor="middle">https://taskmanager.local/kanban-board</text>

  <!-- App Header -->
  <text x="30" y="68" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="bold">Task Management Application</text>
  <rect x="460" y="52" width="110" height="24" rx="6" fill="url(#violetGrad)"/>
  <text x="515" y="68" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">+ Add New Task</text>

  <!-- Kanban Column 1: TO DO -->
  <rect x="30" y="90" width="165" height="225" rx="8" fill="#15122e" stroke="#2e2857" stroke-width="1"/>
  <circle cx="45" cy="110" r="4" fill="#94a3b8"/>
  <text x="56" y="114" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold">TO DO</text>
  <rect x="165" y="104" width="18" height="14" rx="4" fill="#241e4a"/>
  <text x="174" y="115" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">2</text>

  <!-- Task Card 1 in Col 1 -->
  <rect x="40" y="130" width="145" height="70" rx="6" fill="#1f1a42" stroke="#372f6b" stroke-width="1"/>
  <rect x="50" y="142" width="45" height="12" rx="3" fill="rgba(244, 63, 94, 0.2)"/>
  <text x="72" y="151" fill="#f43f5e" font-family="monospace" font-size="7" font-weight="bold" text-anchor="middle">URGENT</text>
  <text x="50" y="169" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">Audit LocalStorage</text>
  <rect x="50" y="180" width="80" height="4" rx="2" fill="#332d60"/>
  <circle cx="165" cy="182" r="8" fill="#6366f1"/>
  <text x="165" y="185" fill="#ffffff" font-family="sans-serif" font-size="7" text-anchor="middle">VP</text>

  <!-- Task Card 2 in Col 1 -->
  <rect x="40" y="210" width="145" height="65" rx="6" fill="#1f1a42" stroke="#372f6b" stroke-width="1"/>
  <rect x="50" y="222" width="40" height="12" rx="3" fill="rgba(6, 182, 212, 0.2)"/>
  <text x="70" y="231" fill="#06b6d4" font-family="monospace" font-size="7" font-weight="bold" text-anchor="middle">FEATURE</text>
  <text x="50" y="249" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">Drag &amp; Drop Reorder</text>

  <!-- Kanban Column 2: IN PROGRESS -->
  <rect x="215" y="90" width="165" height="225" rx="8" fill="#15122e" stroke="#2e2857" stroke-width="1"/>
  <circle cx="230" cy="110" r="4" fill="#06b6d4"/>
  <text x="241" y="114" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold">IN PROGRESS</text>
  <rect x="350" y="104" width="18" height="14" rx="4" fill="#241e4a"/>
  <text x="359" y="115" fill="#06b6d4" font-family="monospace" font-size="9" text-anchor="middle">2</text>

  <!-- Task Card 1 in Col 2 -->
  <rect x="225" y="130" width="145" height="75" rx="6" fill="#1f1a42" stroke="#4f46e5" stroke-width="1.5"/>
  <rect x="235" y="142" width="45" height="12" rx="3" fill="rgba(139, 92, 246, 0.2)"/>
  <text x="257" y="151" fill="#a78bfa" font-family="monospace" font-size="7" font-weight="bold" text-anchor="middle">IN REVIEW</text>
  <text x="235" y="169" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">State Hydration Flow</text>
  <rect x="235" y="180" width="100" height="4" rx="2" fill="#2e2857"/>
  <rect x="235" y="180" width="75" height="4" rx="2" fill="url(#violetGrad)"/>
  <circle cx="350" cy="182" r="8" fill="#8b5cf6"/>
  <text x="350" y="185" fill="#ffffff" font-family="sans-serif" font-size="7" text-anchor="middle">JS</text>

  <!-- Task Card 2 in Col 2 -->
  <rect x="225" y="215" width="145" height="60" rx="6" fill="#1f1a42" stroke="#372f6b" stroke-width="1"/>
  <text x="235" y="240" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">Dark Theme Sync</text>
  <text x="235" y="258" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9">✓ 3 of 4 subtasks</text>

  <!-- Kanban Column 3: COMPLETED -->
  <rect x="400" y="90" width="170" height="225" rx="8" fill="#15122e" stroke="#2e2857" stroke-width="1"/>
  <circle cx="415" cy="110" r="4" fill="#10b981"/>
  <text x="426" y="114" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold">COMPLETED</text>
  <rect x="535" y="104" width="18" height="14" rx="4" fill="#241e4a"/>
  <text x="544" y="115" fill="#10b981" font-family="monospace" font-size="9" text-anchor="middle">5</text>

  <!-- Task Card 1 in Col 3 -->
  <rect x="410" y="130" width="150" height="65" rx="6" fill="#1f1a42" stroke="#059669" stroke-width="1"/>
  <circle cx="425" cy="155" r="7" fill="rgba(16, 185, 129, 0.2)"/>
  <path d="M 422 155 L 424 158 L 428 152" fill="none" stroke="#10b981" stroke-width="1.5"/>
  <text x="438" y="159" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" text-decoration="line-through">Vanilla Storage Store</text>

  <!-- Task Card 2 in Col 3 -->
  <rect x="410" y="205" width="150" height="65" rx="6" fill="#1f1a42" stroke="#059669" stroke-width="1"/>
  <circle cx="425" cy="230" r="7" fill="rgba(16, 185, 129, 0.2)"/>
  <path d="M 422 230 L 424 233 L 428 227" fill="none" stroke="#10b981" stroke-width="1.5"/>
  <text x="438" y="234" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" text-decoration="line-through">Responsive Drawer</text>
</svg>
