<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Ring Accent Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="200" fill="url(#avatarBg)" />

  <!-- Ambient Outer Glow Ring -->
  <circle cx="200" cy="200" r="185" fill="none" stroke="url(#ringGrad)" stroke-width="3" opacity="0.6" stroke-dasharray="8 6" />

  <!-- Abstract Code / Geometric Grid Accent in background -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1">
    <line x1="120" y1="80" x2="280" y2="80" />
    <line x1="90" y1="120" x2="310" y2="120" />
    <line x1="70" y1="160" x2="330" y2="160" />
    <line x1="70" y1="200" x2="330" y2="200" />
    <line x1="90" y1="240" x2="310" y2="240" />
    <line x1="120" y1="280" x2="280" y2="280" />
    <line x1="200" y1="60" x2="200" y2="340" />
  </g>

  <!-- Developer Silhouette Silhouette -->
  <!-- Shoulders & Torso -->
  <path d="M 105 350 C 110 270, 150 250, 200 250 C 250 250, 290 270, 295 350 Z" fill="#334155" />
  <path d="M 125 350 C 130 285, 160 268, 200 268 C 240 268, 270 285, 275 350 Z" fill="#475569" />

  <!-- Neck -->
  <rect x="180" y="205" width="40" height="55" rx="10" fill="#64748b" />

  <!-- Head -->
  <ellipse cx="200" cy="165" rx="55" ry="65" fill="#94a3b8" />

  <!-- Modern Hair Silhouette -->
  <path d="M 145 155 C 142 110, 165 92, 200 92 C 235 92, 258 110, 255 155 C 245 130, 230 120, 200 122 C 170 120, 155 130, 145 155 Z" fill="#0f172a" />

  <!-- Stylish Glasses Silhouette -->
  <rect x="156" y="148" width="34" height="24" rx="6" fill="#0f172a" stroke="#06b6d4" stroke-width="2.5" />
  <rect x="210" y="148" width="34" height="24" rx="6" fill="#0f172a" stroke="#06b6d4" stroke-width="2.5" />
  <line x1="190" y1="160" x2="210" y2="160" stroke="#06b6d4" stroke-width="2.5" />

  <!-- Modern Headphones Accent -->
  <path d="M 142 170 C 136 120, 150 82, 200 82 C 250 82, 264 120, 258 170" fill="none" stroke="#8b5cf6" stroke-width="7" stroke-linecap="round" />
  <rect x="133" y="152" width="14" height="32" rx="7" fill="#8b5cf6" />
  <rect x="253" y="152" width="14" height="32" rx="7" fill="#8b5cf6" />

  <!-- Code Bracket Monogram Overlay -->
  <g transform="translate(160, 290)">
    <rect width="80" height="30" rx="15" fill="#0f172a" stroke="url(#ringGrad)" stroke-width="2" />
    <text x="40" y="20" font-family="monospace" font-size="14" font-weight="bold" fill="#38bdf8" text-anchor="middle">&lt;/dev&gt;</text>
  </g>
</svg>
