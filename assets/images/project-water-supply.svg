<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="waterBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061826"/>
      <stop offset="100%" stop-color="#0c2338"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="340" fill="url(#waterBgGrad)"/>

  <!-- Browser Header Window -->
  <rect width="600" height="36" fill="#04121e"/>
  <circle cx="20" cy="18" r="5" fill="#ef4444"/>
  <circle cx="36" cy="18" r="5" fill="#f59e0b"/>
  <circle cx="52" cy="18" r="5" fill="#10b981"/>
  
  <!-- Address Bar -->
  <rect x="75" y="8" width="450" height="20" rx="10" fill="#0f2b42"/>
  <text x="250" y="22" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" text-anchor="middle">https://water-system.local/telemetry-portal</text>

  <!-- System Title Bar -->
  <text x="30" y="68" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="bold">Water Supply Management System</text>
  <rect x="470" y="55" width="100" height="20" rx="10" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1"/>
  <circle cx="482" cy="65" r="4" fill="#10b981"/>
  <text x="525" y="69" fill="#10b981" font-family="-apple-system, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">SYSTEM ONLINE</text>

  <!-- 3 Metric Cards Across Top -->
  <!-- Card 1: Reservoir Level -->
  <rect x="30" y="90" width="165" height="75" rx="8" fill="#0b2438" stroke="#164e63" stroke-width="1"/>
  <text x="42" y="110" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">Main Reservoir Capacity</text>
  <text x="42" y="136" fill="#38bdf8" font-family="monospace" font-size="20" font-weight="bold">84.6%</text>
  <text x="115" y="136" fill="#10b981" font-family="-apple-system, sans-serif" font-size="10">▲ Stable</text>
  <rect x="42" y="148" width="140" height="5" rx="2.5" fill="#032030"/>
  <rect x="42" y="148" width="118" height="5" rx="2.5" fill="url(#waterGrad)"/>

  <!-- Card 2: Pipe Flow Rate -->
  <rect x="215" y="90" width="165" height="75" rx="8" fill="#0b2438" stroke="#164e63" stroke-width="1"/>
  <text x="227" y="110" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">Distribution Flow Rate</text>
  <text x="227" y="136" fill="#06b6d4" font-family="monospace" font-size="20" font-weight="bold">1,420</text>
  <text x="288" y="136" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">L/min</text>
  <rect x="227" y="148" width="140" height="5" rx="2.5" fill="#032030"/>
  <rect x="227" y="148" width="105" height="5" rx="2.5" fill="url(#waterGrad)"/>

  <!-- Card 3: Water Quality Index -->
  <rect x="400" y="90" width="170" height="75" rx="8" fill="#0b2438" stroke="#164e63" stroke-width="1"/>
  <text x="412" y="110" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">Water Purity Index</text>
  <text x="412" y="136" fill="#10b981" font-family="monospace" font-size="20" font-weight="bold">99.2</text>
  <text x="460" y="136" fill="#10b981" font-family="-apple-system, sans-serif" font-size="10">WQI (Grade A)</text>
  <rect x="412" y="148" width="145" height="5" rx="2.5" fill="#032030"/>
  <rect x="412" y="148" width="140" height="5" rx="2.5" fill="url(#emeraldGrad)"/>

  <!-- Main Pipeline Network Diagram & Chart -->
  <rect x="30" y="180" width="350" height="135" rx="8" fill="#0b2438" stroke="#164e63" stroke-width="1"/>
  <text x="45" y="202" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Pipeline Pressure &amp; Consumption Telemetry</text>
  
  <!-- Flow Curve / Wave Chart -->
  <path d="M 45 280 Q 90 230, 135 250 T 225 220 T 315 240 T 365 210" fill="none" stroke="#06b6d4" stroke-width="3"/>
  <path d="M 45 280 Q 90 230, 135 250 T 225 220 T 315 240 T 365 210 L 365 295 L 45 295 Z" fill="rgba(6, 182, 212, 0.15)"/>
  
  <!-- Chart Grid Lines -->
  <line x1="45" y1="230" x2="365" y2="230" stroke="#164e63" stroke-width="0.5" stroke-dasharray="2 2"/>
  <line x1="45" y1="260" x2="365" y2="260" stroke="#164e63" stroke-width="0.5" stroke-dasharray="2 2"/>
  <text x="45" y="306" fill="#64748b" font-family="monospace" font-size="8">00:00</text>
  <text x="145" y="306" fill="#64748b" font-family="monospace" font-size="8">06:00</text>
  <text x="245" y="306" fill="#64748b" font-family="monospace" font-size="8">12:00</text>
  <text x="340" y="306" fill="#64748b" font-family="monospace" font-size="8">18:00</text>

  <!-- Side Control Panel: Valve Nodes -->
  <rect x="400" y="180" width="170" height="135" rx="8" fill="#0b2438" stroke="#164e63" stroke-width="1"/>
  <text x="415" y="202" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Distribution Valves</text>
  
  <!-- Valve 1 -->
  <rect x="415" y="215" width="140" height="24" rx="4" fill="#071b2b"/>
  <circle cx="427" cy="227" r="4" fill="#10b981"/>
  <text x="438" y="230" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="9">Zone A - North Sector</text>
  <text x="532" y="230" fill="#10b981" font-family="monospace" font-size="8">OPEN</text>

  <!-- Valve 2 -->
  <rect x="415" y="245" width="140" height="24" rx="4" fill="#071b2b"/>
  <circle cx="427" cy="257" r="4" fill="#10b981"/>
  <text x="438" y="260" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="9">Zone B - Central Hub</text>
  <text x="532" y="260" fill="#10b981" font-family="monospace" font-size="8">OPEN</text>

  <!-- Valve 3 -->
  <rect x="415" y="275" width="140" height="24" rx="4" fill="#071b2b"/>
  <circle cx="427" cy="287" r="4" fill="#f59e0b"/>
  <text x="438" y="290" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="9">Zone C - South Reservoir</text>
  <text x="530" y="290" fill="#f59e0b" font-family="monospace" font-size="8">AUTO</text>
</svg>
