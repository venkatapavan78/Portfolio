<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | Venkata Pavan Portfolio</title>
  
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
  <div class="ambient-glow" aria-hidden="true"></div>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <a href="../index.html" class="brand auth-brand">
          <span class="brand-monogram">VP</span>
        </a>
        <h1 class="auth-title">Create an Account</h1>
        <p class="auth-subtitle">Register to unlock personalized portfolio features</p>
      </div>

      <div class="auth-notice-banner auth-notice-violet">
        <span class="auth-notice-text auth-notice-text-violet">
          [Placeholder] Module: Registration will be activated in the next phase.
        </span>
      </div>

      <form class="auth-form">
        <div class="form-group">
          <label class="form-label" for="name">Full Name</label>
          <input class="form-input" type="text" id="name" placeholder="John Doe" disabled>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input class="form-input" type="email" id="email" placeholder="name@example.com" disabled>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="form-input" type="password" id="password" placeholder="••••••••" disabled>
        </div>

        <button type="submit" class="btn btn-primary auth-submit-btn" disabled>
          Create Account (Coming Soon)
        </button>
      </form>

      <div class="form-footer">
        <p>Already have an account? <a href="login.html" class="form-link">Sign In</a></p>
        <p class="form-footer-action">
          <a href="../index.html" class="form-link">← Return to Home</a>
        </p>
      </div>
    </div>
  </div>

  <script src="../js/storage.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
